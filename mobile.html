<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081c46">
<title>افتح الصفحة من كمبيوتر أو تابلت | Open on a computer or tablet</title>
<script>
/* A computer or tablet that lands here goes to the page itself. */
(function(){try{var s=Math.min(screen.width,screen.height),p=/iPhone|iPod|Android.+Mobile|Windows Phone|IEMobile|BlackBerry|BB10|Opera Mini/.test(navigator.userAgent);
if(!p&&s>=600)location.replace('/');}catch(e){}})();
</script>
<style>
  :root { --navy:#081c46; --deep:#1246a8; --sun:#ffc23d; --soft:#bcd3ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--navy); color:#fff;
    font:17px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; -webkit-text-size-adjust:100%; }
  body { background:linear-gradient(165deg,var(--navy) 0%,#0c2a6a 60%,var(--deep) 130%); }
  main { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom)); }
  .name { font-size:.95rem; letter-spacing:.04em; color:var(--soft); }
  .devices { margin:22px 0 18px; width:150px; height:auto; }
  h1 { margin:0; font-size:1.5rem; line-height:1.35; font-weight:700; text-wrap:balance; }
  .rule { width:56px; height:4px; border-radius:2px; background:var(--sun); margin:18px auto; }
  h2 { margin:0; direction:ltr; font-size:1.3rem; line-height:1.3; font-weight:700; text-wrap:balance; }
  p { margin:10px 0 0; color:var(--soft); max-width:22rem; text-wrap:pretty; }
  p.en { direction:ltr; }
  button { margin-top:24px; min-height:52px; padding:0 26px; border:0; border-radius:14px; background:var(--sun); color:var(--navy);
    font:inherit; font-weight:700; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .url { margin-top:14px; direction:ltr; font-size:.95rem; color:var(--soft); letter-spacing:.02em; word-break:break-all; }
</style>
</head>
<body>
<main>
  <div class="name">دراسة جدوى · Feasibility Study</div>
  <svg class="devices" viewBox="0 0 168 96" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="18" y="8" width="96" height="62" rx="6"/><path d="M6 80h120"/>
    <rect x="124" y="30" width="38" height="52" rx="5" fill="#081c46"/><path d="M140 74h6"/>
  </svg>
  <h1>هذه الصفحة لا تُفتح على الجوال</h1>
  <p>افتح الرابط من كمبيوتر أو لابتوب أو تابلت أو آيباد لعرض دراسة الجدوى.</p>
  <div class="rule"></div>
  <h2>This page does not open on phones</h2>
  <p class="en">Please open the link on a PC, laptop, tablet or iPad to view the feasibility study.</p>
  <button type="button" id="copy" data-done="تم النسخ · Copied">نسخ الرابط · Copy link</button>
  <div class="url">feasibility.dubaiincairo.com/</div>
</main>
<script>
(function(){var b=document.getElementById('copy'),t=b.textContent,u='https://feasibility.dubaiincairo.com/';
b.addEventListener('click',function(){var ok=function(){b.textContent=b.dataset.done;setTimeout(function(){b.textContent=t},2200)};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,function(){prompt('',u)});else prompt('',u);});})();
</script>
</body>
</html>
